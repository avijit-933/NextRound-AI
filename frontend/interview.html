<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview in progress — NextRound AI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<style>
body{background:var(--bg) !important;}
.iv-topbar{
  position:fixed;top:0;left:0;right:0;z-index:900;
  background:var(--nav-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);
  padding:.85rem 1.25rem;
}
.iv-main{padding:6.5rem 1.25rem 2.5rem;max-width:1200px;margin:0 auto;}
.cam-frame{
  position:relative;border-radius:20px;overflow:hidden;height:340px;
  background:radial-gradient(circle at 50% 35%, rgba(99,102,241,.25), rgba(11,15,25,.9) 70%);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
}
.face-box{
  position:absolute;width:150px;height:190px;top:60px;left:calc(50% - 75px);
  border:2px solid var(--success);border-radius:14px;
  box-shadow:0 0 20px rgba(52,211,153,.4);
  animation:facepulse 2.4s ease-in-out infinite;
}
@keyframes facepulse{0%,100%{border-color:var(--success);}50%{border-color:var(--primary-2);}}
.cam-overlay-tag{
  position:absolute;top:12px;left:12px;background:rgba(0,0,0,.45);color:#fff;
  padding:.3rem .7rem;border-radius:8px;font-size:.72rem;font-family:'JetBrains Mono',monospace;
}
.cam-warning{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  background:rgba(248,113,113,.9);color:#fff;padding:.4rem 1rem;border-radius:99px;
  font-size:.78rem;font-weight:600;display:none;align-items:center;gap:.4rem;
}
.mic-btn{
  width:64px;height:64px;border-radius:50%;border:none;
  background:var(--grad-main);color:#fff;font-size:1.4rem;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(99,102,241,.4); transition:.2s;
}
.mic-btn.listening{animation:mic-pulse 1.4s infinite;}
@keyframes mic-pulse{0%{box-shadow:0 0 0 0 rgba(248,113,113,.5);}70%{box-shadow:0 0 0 16px rgba(248,113,113,0);}100%{box-shadow:0 0 0 0 rgba(248,113,113,0);}}
.transcript-box{
  height:150px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:.9rem 1rem;font-size:.9rem;line-height:1.5;
}
.emo-bar-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem;}
.emo-bar-row .lbl{width:64px;font-size:.72rem;color:var(--text-muted);}
.emo-bar-row .track{flex:1;height:6px;border-radius:99px;background:var(--surface);overflow:hidden;}
.emo-bar-row .fill{height:100%;border-radius:99px;transition:width .8s ease;}
</style>
</head>
<body>

<div class="iv-topbar">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div class="d-flex align-items-center gap-3">
      <a href="dashboard.html" class="btn-nr-ghost btn btn-sm" onclick="return confirm('Leave interview? Progress will be lost.');"><i class="bi bi-x-lg"></i></a>
      <span class="pill" id="typeBadge"><i class="bi bi-cpu"></i> Technical</span>
      <span class="pill" id="roleBadge">AI Engineer</span>
      <span class="pill pill-live"><span class="pill-dot"></span> Live</span>
    </div>
    <div class="d-flex align-items-center gap-3">
      <div class="timer fw-bold fs-5" id="timerDisplay">20:00</div>
      <button class="theme-toggle" onclick="toggleTheme()"><i class="bi bi-moon-stars"></i></button>
    </div>
  </div>
  <div class="nr-progress mt-2"><div class="bar" id="ivProgress" style="width:8%;"></div></div>
</div>

<div class="iv-main">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="eyebrow" id="qCounter">Question 1 of 6</div>
  </div>

  <div class="glass-card p-4 mb-4">
    <div class="d-flex gap-3 align-items-start">
      <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width:40px;height:40px;background:var(--grad-main);"><i class="bi bi-stars text-white"></i></div>
      <div>
        <div class="text-muted-custom small mb-1">AI Interviewer</div>
        <div class="fs-5 fw-medium" id="questionText">Loading your personalized question…</div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <!-- camera + analysis -->
    <div class="col-lg-6">
      <div class="cam-frame mb-3">
        <div class="cam-overlay-tag"><i class="bi bi-camera-video-fill me-1"></i> <span id="camLiveLabel">Live</span></div>
        <div class="cam-overlay-tag" style="left:auto;right:12px;" id="eyeContactTag">Eye contact: —%</div>
        <video id="camVideo" autoplay muted playsinline style="width:100%;height:100%;object-fit:cover;display:none;"></video>
        <canvas id="camCanvas" style="display:none;"></canvas>
        <i class="bi bi-person-fill" id="camFallbackIcon" style="font-size:5.5rem;color:rgba(255,255,255,.25);"></i>
        <div class="face-box" id="camFaceBox" style="display:none;"></div>
        <div class="cam-warning" id="camWarning"><i class="bi bi-exclamation-triangle-fill"></i> Please look at the camera</div>
      </div>
      <div class="row g-3">
        <div class="col-6">
          <div class="glass-card p-3">
            <div class="text-muted-custom small mb-1">Head pose</div>
            <div class="fw-semibold" id="headPose">Centered</div>
          </div>
        </div>
        <div class="col-6">
          <div class="glass-card p-3">
            <div class="text-muted-custom small mb-1">Face visibility</div>
            <div class="fw-semibold text-success" id="faceVis">Clear</div>
          </div>
        </div>
      </div>
      <div class="glass-card p-3 mt-3">
        <div class="fw-semibold small mb-2"><i class="bi bi-emoji-smile me-1"></i> Live emotion</div>
        <div class="emo-bar-row"><div class="lbl">Happy</div><div class="track"><div class="fill" id="emo-happy" style="width:20%;background:var(--success);"></div></div></div>
        <div class="emo-bar-row"><div class="lbl">Neutral</div><div class="track"><div class="fill" id="emo-neutral" style="width:55%;background:var(--primary-2);"></div></div></div>
        <div class="emo-bar-row"><div class="lbl">Sad</div><div class="track"><div class="fill" id="emo-sad" style="width:5%;background:#818CF8;"></div></div></div>
        <div class="emo-bar-row"><div class="lbl">Angry</div><div class="track"><div class="fill" id="emo-angry" style="width:3%;background:var(--danger);"></div></div></div>
        <div class="emo-bar-row"><div class="lbl">Fear</div><div class="track"><div class="fill" id="emo-fear" style="width:4%;background:var(--violet);"></div></div></div>
        <div class="emo-bar-row"><div class="lbl">Surprise</div><div class="track"><div class="fill" id="emo-surprise" style="width:13%;background:var(--warning);"></div></div></div>
      </div>
    </div>

    <!-- transcript + mic -->
    <div class="col-lg-6">
      <div class="glass-card p-4 h-100 d-flex flex-column">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="fw-semibold"><i class="bi bi-mic me-1"></i> Your answer</div>
          <span class="pill" id="micStatusPill"><span class="pill-dot" style="background:var(--text-muted);"></span> Mic off</span>
        </div>
        <label class="form-label-nr">Live transcript (editable)</label>
        <textarea class="transcript-box form-control-nr mb-3" id="transcriptBox" placeholder="Your spoken answer will appear here as you talk. You can edit it anytime."></textarea>
        <div class="d-flex align-items-center justify-content-center gap-4 my-3">
          <button class="mic-btn" id="micBtn" onclick="toggleMic()"><i class="bi bi-mic-fill" id="micIcon"></i></button>
        </div>
        <div class="waveform justify-content-center mb-3" id="waveform" style="opacity:.2;"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="mt-auto d-flex gap-2">
          <button class="btn-nr-ghost btn" id="prevBtn" onclick="prevQuestion()" disabled><i class="bi bi-arrow-left"></i></button>
          <button class="btn-nr-outline btn flex-grow-1" onclick="skipQuestion()">Skip</button>
          <button class="btn-nr-primary btn flex-grow-1" id="submitBtn" onclick="submitAnswer()">Submit answer</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
requireAuth();

/* ---------- resolve interview id from URL ---------- */
const urlParams = new URLSearchParams(window.location.search);
const interviewId = urlParams.get('id');
if (!interviewId) {
  showToast('No interview selected — redirecting to setup.', 'danger');
  setTimeout(()=> window.location.href = 'interview_setup.html', 1200);
}

let questions = [];
let currentQIndex = 0;
let totalQ = 0;
let secondsLeft = 20 * 60;
let timerInterval = null;
const answersLocal = {}; // question_id -> transcript text typed so far, so Previous doesn't lose it

function renderQuestion(index){
  // Stash whatever's currently in the box against the question we're leaving,
  // so coming back to it (via Previous) restores it instead of showing blank.
  if (questions[currentQIndex]) {
    answersLocal[questions[currentQIndex].id] = document.getElementById('transcriptBox').value;
  }

  currentQIndex = index;
  const q = questions[index];
  document.getElementById('questionText').textContent = q.question_text;
  document.getElementById('qCounter').textContent = `Question ${index+1} of ${totalQ}`;
  document.getElementById('ivProgress').style.width = ((index+1)/totalQ*100)+'%';
  document.getElementById('transcriptBox').value = answersLocal[q.id] || '';
  document.getElementById('prevBtn').disabled = (index === 0);
  if (listening) toggleMic();
}

function prevQuestion(){
  if (currentQIndex === 0) return;
  renderQuestion(currentQIndex - 1);
}

function startTimer(durationMinutes){
  secondsLeft = (durationMinutes || 20) * 60;
  const timerEl = document.getElementById('timerDisplay');
  function tick(){
    if (secondsLeft <= 0){ finishInterview(); return; }
    secondsLeft--;
    const m = String(Math.floor(secondsLeft/60)).padStart(2,'0');
    const s = String(secondsLeft%60).padStart(2,'0');
    timerEl.textContent = `${m}:${s}`;
  }
  clearInterval(timerInterval);
  timerInterval = setInterval(tick, 1000);
}

/* ---------- webcam: real getUserMedia feed + periodic frame analysis ---------- */
const video = document.getElementById('camVideo');
const canvas = document.getElementById('camCanvas');
const fallbackIcon = document.getElementById('camFallbackIcon');
const faceBox = document.getElementById('camFaceBox');
let webcamActive = false;
let frameTimestamp = 0;
let visionInterval = null, emotionInterval = null;

async function initWebcam(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 480, height: 360 }, audio: false });
    video.srcObject = stream;
    video.style.display = 'block';
    fallbackIcon.style.display = 'none';
    faceBox.style.display = 'block';
    webcamActive = true;
    document.getElementById('camLiveLabel').textContent = 'Live';

    // Send a frame for vision + emotion analysis every 3 seconds.
    visionInterval = setInterval(()=> captureAndAnalyze('vision'), 3000);
    emotionInterval = setInterval(()=> captureAndAnalyze('emotion'), 3000);
  } catch (err) {
    document.getElementById('camLiveLabel').textContent = 'Camera unavailable';
    showToast('Camera access was denied or unavailable — webcam analysis is disabled for this session.', 'info');
  }
}

function grabFrameBase64(){
  canvas.width = video.videoWidth || 480;
  canvas.height = video.videoHeight || 360;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.7);
}

async function captureAndAnalyze(kind){
  if (!webcamActive || video.readyState < 2) return;
  const base64 = grabFrameBase64();
  frameTimestamp += 3;
  try {
    if (kind === 'vision') {
      const result = await InterviewAPI.visionFrame(interviewId, base64, frameTimestamp);
      renderVisionResult(result);
    } else {
      const result = await InterviewAPI.emotionFrame(interviewId, base64, frameTimestamp);
      renderEmotionResult(result);
    }
  } catch (err) {
    // Non-fatal — skip this frame's analysis and try again on the next tick.
    console.warn(`${kind}-frame analysis failed:`, err.message);
  }
}

function renderVisionResult(result){
  document.getElementById('eyeContactTag').textContent = `Eye contact: ${Math.round(result.eye_contact_pct)}%`;
  document.getElementById('camWarning').style.display = result.eye_contact_pct < 60 || !result.face_visible ? 'flex' : 'none';
  const headPoseEl = document.getElementById('headPose');
  headPoseEl.textContent = result.head_pose;
  const faceVisEl = document.getElementById('faceVis');
  faceVisEl.textContent = result.face_visible ? (result.multiple_faces_detected ? 'Multiple faces' : 'Clear') : 'Not detected';
  faceVisEl.className = 'fw-semibold ' + (result.face_visible && !result.multiple_faces_detected ? 'text-success' : '');
  faceVisEl.style.color = (!result.face_visible || result.multiple_faces_detected) ? 'var(--warning)' : '';
}

function renderEmotionResult(scores){
  const colors = { happy:'var(--success)', neutral:'var(--primary-2)', sad:'#818CF8', angry:'var(--danger)', fear:'var(--violet)', surprise:'var(--warning)' };
  Object.entries(scores).forEach(([emotion, pct])=>{
    const el = document.getElementById('emo-'+emotion);
    if (el) el.style.width = Math.round(pct) + '%';
  });
}

/* ---------- mic: real MediaRecorder -> Whisper transcription ---------- */
let listening = false;
let mediaRecorder = null;
let audioChunks = [];

async function toggleMic(){
  const btn = document.getElementById('micBtn');
  const icon = document.getElementById('micIcon');
  const pill = document.getElementById('micStatusPill');
  const wf = document.getElementById('waveform');

  if (!listening) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.start();

      listening = true;
      btn.classList.add('listening');
      wf.style.opacity = '1';
      icon.className = 'bi bi-mic-fill';
      pill.innerHTML = '<span class="pill-dot pill-live" style="background:var(--danger);"></span> Listening…';
    } catch (err) {
      showToast('Microphone access was denied — you can still type your answer.', 'danger');
    }
  } else {
    listening = false;
    btn.classList.remove('listening');
    wf.style.opacity = '.2';
    pill.innerHTML = '<span class="pill-dot pill-live" style="background:var(--warning);"></span> Transcribing…';

    mediaRecorder.addEventListener('stop', async () => {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
      try {
        const question = questions[currentQIndex];
        const { transcript_text } = await InterviewAPI.submitAnswerAudio(interviewId, question.id, audioBlob);
        const box = document.getElementById('transcriptBox');
        box.value = (box.value + ' ' + transcript_text).trim();
        pill.innerHTML = '<span class="pill-dot" style="background:var(--text-muted);"></span> Mic off';
      } catch (err) {
        showToast(err.message, 'danger');
        pill.innerHTML = '<span class="pill-dot" style="background:var(--text-muted);"></span> Mic off';
      }
    }, { once: true });

    mediaRecorder.stop();
  }
}

/* ---------- question flow ---------- */
async function submitAnswer(){
  const val = document.getElementById('transcriptBox').value.trim();
  if (!val){ showToast('Record or type an answer before submitting.', 'danger'); return; }

  const btn = document.getElementById('submitBtn');
  const originalHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-ring"></span> Submitting...';

  try {
    const question = questions[currentQIndex];
    await InterviewAPI.submitAnswer(interviewId, { question_id: question.id, transcript_text: val, was_skipped: false });
    showToast('Answer submitted.', 'success');
    advanceQuestion();
  } catch (err) {
    showToast(err.message, 'danger');
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalHtml;
  }
}

async function skipQuestion(){
  try {
    const question = questions[currentQIndex];
    await InterviewAPI.submitAnswer(interviewId, { question_id: question.id, transcript_text: '', was_skipped: true });
    showToast('Question skipped.', 'info');
    advanceQuestion();
  } catch (err) {
    showToast(err.message, 'danger');
  }
}

function advanceQuestion(){
  const nextIndex = currentQIndex + 1;
  if (nextIndex >= totalQ) { finishInterview(); return; }
  renderQuestion(nextIndex);
}

async function finishInterview(){
  clearInterval(timerInterval);
  clearInterval(visionInterval);
  clearInterval(emotionInterval);
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());

  showToast('Interview complete! Evaluating your answers with Gemini…', 'success');
  try {
    await InterviewAPI.complete(interviewId);
    setTimeout(()=> window.location.href = `result.html?id=${interviewId}`, 1000);
  } catch (err) {
    showToast(err.message, 'danger');
  }
}

/* ---------- reflect the setup choices (role / type / duration) on this page ---------- */
const TYPE_ICONS = { HR: 'bi-people', Technical: 'bi-cpu', Coding: 'bi-code-slash', Aptitude: 'bi-puzzle' };

function applyInterviewMeta(){
  let meta = null;
  try {
    const raw = sessionStorage.getItem('nr-interview-meta');
    if (raw) {
      const parsed = JSON.parse(raw);
      // Only trust it if it matches the interview we're actually running —
      // guards against a stale entry from a previous interview in this tab.
      if (String(parsed.interview_id) === String(interviewId)) meta = parsed;
    }
  } catch { /* ignore malformed/missing session data */ }

  if (!meta) return null;

  const icon = TYPE_ICONS[meta.interview_type] || 'bi-cpu';
  document.getElementById('typeBadge').innerHTML = `<i class="bi ${icon}"></i> ${meta.interview_type}`;
  document.getElementById('roleBadge').textContent = meta.job_role;
  return meta;
}

/* ---------- boot ---------- */
(async function boot(){
  if (!interviewId) return;
  const meta = applyInterviewMeta();
  await initWebcam();
  try {
    const q = await InterviewAPI.questions(interviewId);
    questions = q;
    totalQ = q.length;
    if (!totalQ) throw new Error('This interview has no questions.');
    renderQuestion(0);
    startTimer(meta ? meta.duration_minutes : 20);
  } catch (err) {
    showToast(err.message, 'danger');
  }
})();
</script>
</body>
</html>
