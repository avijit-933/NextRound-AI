<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 520" width="1920" height="520">
  <defs>
    <linearGradient id="wmGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="wmGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5D98E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F5D98E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F5D98E" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="wmGlowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wmGlowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wmGlowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wmVignette" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.05"/>
    </radialGradient>
    <pattern id="wmDots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#6366F1" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <!-- base texture -->
  <rect width="1920" height="520" fill="url(#wmDots)"/>

  <!-- soft ambient glows -->
  <circle cx="260"  cy="120" r="260" fill="url(#wmGlowA)"/>
  <circle cx="960"  cy="60"  r="220" fill="url(#wmGlowC)"/>
  <circle cx="1680" cy="400" r="280" fill="url(#wmGlowB)"/>
  <circle cx="700"  cy="440" r="200" fill="url(#wmGlowA)" opacity="0.65"/>

  <!-- large faint brand monogram, oversized true watermark motif -->
  <g opacity="0.045" font-family="'Space Grotesk', sans-serif" font-weight="700" fill="url(#wmGrad1)">
    <text x="-40"  y="400" font-size="440">N</text>
    <text x="440"  y="400" font-size="440">N</text>
    <text x="920"  y="400" font-size="440">N</text>
    <text x="1400" y="400" font-size="440">N</text>
    <text x="1880" y="400" font-size="440">N</text>
  </g>

  <!-- elegant constellation / network lines, echoes the "AI" theme -->
  <g stroke="url(#wmGrad1)" stroke-opacity="0.16" stroke-width="1">
    <path d="M120,90 L340,180 L560,110 L800,210 L1040,120 L1300,220 L1560,130 L1800,200" fill="none"/>
    <path d="M60,430 L300,360 L540,420 L780,340 L1020,410 L1280,350 L1540,420 L1800,360" fill="none"/>
  </g>
  <g fill="#8B5CF6" fill-opacity="0.35">
    <circle cx="340" cy="180" r="3"/>
    <circle cx="800" cy="210" r="3"/>
    <circle cx="1300" cy="220" r="3"/>
    <circle cx="300" cy="360" r="3"/>
    <circle cx="780" cy="340" r="3"/>
    <circle cx="1280" cy="350" r="3"/>
  </g>

  <!-- slender gold accent rules top & bottom for a premium, boutique finish -->
  <rect x="0" y="8"   width="1920" height="1" fill="url(#wmGold)"/>
  <rect x="0" y="511" width="1920" height="1" fill="url(#wmGold)"/>

  <!-- vignette to keep the very edges calm -->
  <rect width="1920" height="520" fill="url(#wmVignette)"/>
</svg>
